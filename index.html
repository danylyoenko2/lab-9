<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 8</title>
    <style>
      body {
        box-sizing: border-box;
        padding: 0;
        margin: 0 auto;
        max-width: 640px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 30px;
      }

      .game {
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        margin: 20px;
      }

      .player {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .score {
        width: 120px;
        padding: 8px;
        background-color: #c6c6c689;
        border: 2px solid #010101;
        border-radius: 8px;
        font-weight: bold;
      }

      .circle {
        width: 120px;
        height: 120px;
        border: 3px solid black;
        border-radius: 50%;
        background-color: yellow;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 48px;
        font-weight: bold;
      }

      button {
        padding: 20px 40px;
        font-size: 24px;
        font-weight: 500;
        background-color: #00ff00;
        border: 2px solid #010101;
        border-radius: 12px;
        cursor: pointer;
      }

      button:disabled {
        background-color: #999;
        cursor: not-allowed;
      }

      .msg
      {
        font-size: 18px;
        font-weight: 500;
      }

      @media (max-width: 600px) {
        .game {
          flex-direction: column;
          gap: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="player">
          <h2 data-user="username">User</h2>
          <div class="score" data-score="user">0</div>
          <div class="circle" data-num="user">?</div>
        </div>
      <button data-btn="start">Generate</button>

      <div class="player">
        <h2>Computer</h2>
        <div class="score" data-score="comp">0</div>
        <div class="circle" data-num="comp">?</div>
      </div>

      
    </div>
    <p class="msg" data-msg></p>
    <button data-btn="reset" hidden>Play again</button>
    <script type="module" src="main.js"></script>
  </body>
</html>
