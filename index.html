<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="player" id="user-block" style="grid-area: user;">
      <h2 class="player__name" id="user-name">User</h2>
      <div class="score" id="user-score">0</div>
      <div class="card card--back" id="user-card">
        <span class="card__corner card__corner--top"><span class="card__rank"></span><span class="card__mini-suit"></span></span>
        <span class="card__suit"></span>
        <span class="card__corner card__corner--bottom"><span class="card__rank"></span><span class="card__mini-suit"></span></span>
      </div>
      <p class="caption" id="user-caption">&nbsp;</p>
    </section>

    <section class="center" style="grid-area: center;">
      <p class="attempt" id="attempt">Спроба 0 з 3</p>
      <button class="btn btn--generate" id="generate" type="button">Generate</button>
      <p class="result" id="result" aria-live="polite"></p>
      <button class="btn btn--restart" id="restart" type="button">Грати знову</button>
    </section>

    <section class="player" id="computer-block" style="grid-area: computer;">
      <h2 class="player__name" id="computer-name">Computer</h2>
      <div class="score" id="computer-score">0</div>
      <div class="card card--back" id="computer-card">
        <span class="card__corner card__corner--top"><span class="card__rank"></span><span class="card__mini-suit"></span></span>
        <span class="card__suit"></span>
        <span class="card__corner card__corner--bottom"><span class="card__rank"></span><span class="card__mini-suit"></span></span>
      </div>
      <p class="caption" id="computer-caption">&nbsp;</p>
    </section>

  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
